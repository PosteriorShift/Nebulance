<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Nebulance — Engineering coherence." />
<meta name="theme-color" content="#ffffff" />
<title>Nebulance — Engineering Coherence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root, html[data-theme="light"] {
    --bg:#fafafa; --bg-elev:#ffffff; --bg-elev-2:#f2f2f4;
    --surface:rgba(0,0,0,0.025); --surface-2:rgba(0,0,0,0.05); --surface-3:rgba(0,0,0,0.075);
    --ink:#0a0a0c; --ink-soft:rgba(10,10,12,0.62); --ink-mute:rgba(10,10,12,0.42); --ink-faint:rgba(10,10,12,0.14);
    --line:rgba(10,10,12,0.08); --line-strong:rgba(10,10,12,0.16);
    --blue:#0066FF; --blue-bright:#1877F2; --blue-glow:rgba(0,102,255,0.28); --blue-ink:#0066FF;
    --nav-bg:rgba(250,250,250,0.78); --nav-border:rgba(10,10,12,0.06);
    --shadow-deep:0 40px 100px rgba(10,10,12,0.10); --shadow-soft:0 20px 60px rgba(10,10,12,0.06);
    --grain-blend:multiply; --grain-opacity:0.035; color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg:#000000; --bg-elev:#0a0a0c; --bg-elev-2:#121215;
    --surface:rgba(255,255,255,0.035); --surface-2:rgba(255,255,255,0.06); --surface-3:rgba(255,255,255,0.09);
    --ink:#f5f5f7; --ink-soft:rgba(245,245,247,0.68); --ink-mute:rgba(245,245,247,0.42); --ink-faint:rgba(245,245,247,0.18);
    --line:rgba(245,245,247,0.10); --line-strong:rgba(245,245,247,0.22);
    --blue:#1877F2; --blue-bright:#4A9BFF; --blue-glow:rgba(24,119,242,0.45); --blue-ink:#4A9BFF;
    --nav-bg:rgba(0,0,0,0.72); --nav-border:rgba(245,245,247,0.06);
    --shadow-deep:0 40px 100px rgba(0,0,0,0.5); --shadow-soft:0 20px 60px rgba(0,0,0,0.35);
    --grain-blend:overlay; --grain-opacity:0.045; color-scheme: dark;
  }

  :root {
    --font-sans:"Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    --font-serif:"Instrument Serif", Georgia, serif;
    --font-mono:"JetBrains Mono", ui-monospace, monospace;
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }

  html { scroll-behavior: smooth; background: var(--bg); -webkit-font-smoothing: antialiased; transition: background 0.6s var(--ease); }
  body { min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.5; letter-spacing: -0.011em; overflow-x: hidden; transition: background 0.6s var(--ease), color 0.6s var(--ease); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  img { display: block; max-width: 100%; height: auto; }
  ::selection { background: var(--blue); color: #fff; }

  /* Loading skeleton */
  .loading-overlay { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 99999; transition: opacity 0.5s; }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loader { width: 40px; height: 40px; border: 2px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* AMBIENT */
  .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .ambient-glow { position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: -70vmax; transform: translateX(-50%); background: radial-gradient(ellipse at center, var(--blue-glow) 0%, color-mix(in srgb, var(--blue) 30%, transparent) 20%, transparent 55%); filter: blur(50px); opacity: 0.28; }
  html[data-theme="dark"] .ambient-glow { opacity: 0.55; }
  .ambient-glow-2 { position: absolute; width: 90vmax; height: 90vmax; right: -30vmax; bottom: -40vmax; background: radial-gradient(circle, var(--blue-glow), transparent 60%); filter: blur(60px); opacity: 0.14; }
  html[data-theme="dark"] .ambient-glow-2 { opacity: 0.28; }
  .grain { position: fixed; inset: -100%; pointer-events: none; z-index: 9999; opacity: var(--grain-opacity); background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 200px 200px; animation: grain 8s steps(6) infinite; mix-blend-mode: var(--grain-blend); }
  @keyframes grain { 0%,100%{transform:translate(0,0);} 10%{transform:translate(-5%,-8%);} 20%{transform:translate(-12%,4%);} 30%{transform:translate(6%,-12%);} 40%{transform:translate(-4%,14%);} 50%{transform:translate(-12%,8%);} 60%{transform:translate(12%,0%);} 70%{transform:translate(0%,12%);} 80%{transform:translate(3%,14%);} 90%{transform:translate(-8%,6%);} }
  .cursor-light { position: fixed; width: 700px; height: 700px; border-radius: 50%; pointer-events: none; z-index: 1; transform: translate(-50%,-50%); background: radial-gradient(circle, var(--blue-glow), transparent 65%); filter: blur(40px); opacity: 0; transition: opacity 0.8s; mix-blend-mode: var(--grain-blend); will-change: transform; }
  body:hover .cursor-light { opacity: 0.4; }

  /* NAV */
  .nav-shell { position: fixed; top: 0; left: 0; width: 100%; z-index: 100; background: var(--nav-bg); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border-bottom: 1px solid var(--nav-border); }
  .nav-inner { width: min(1240px, calc(100% - 48px)); margin: 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .brand-glyph { width: 22px; height: 22px; position: relative; border-radius: 50%; background: linear-gradient(140deg, var(--ink) 0%, color-mix(in srgb, var(--ink) 70%, transparent) 100%); box-shadow: 0 0 0 0.5px color-mix(in srgb, var(--ink) 15%, transparent), 0 0 20px var(--blue-glow); }
  .brand-glyph::before { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: var(--bg); }
  .brand-glyph::after { content: ""; position: absolute; width: 7px; height: 7px; right: 2.5px; bottom: 2.5px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); }
  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-links a { padding: 8px 14px; border-radius: 8px; color: var(--ink-soft); font-size: 13px; transition: color 0.25s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-actions { display: flex; align-items: center; gap: 8px; }
  .theme-toggle { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-soft); transition: all 0.3s; position: relative; overflow: hidden; }
  .theme-toggle:hover { background: var(--surface-3); color: var(--ink); transform: rotate(25deg); }
  .theme-toggle svg { width: 15px; height: 15px; position: absolute; transition: opacity 0.4s, transform 0.5s; }
  .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.6); }
  .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
  html[data-theme="light"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0) scale(1); }
  html[data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.6); }
  .nav-cta { height: 34px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: #fff; font-size: 12.5px; font-weight: 550; box-shadow: 0 4px 20px var(--blue-glow); transition: all 0.3s; }
  .nav-cta:hover { background: var(--blue-bright); transform: translateY(-1px); }
  .nav-menu-btn { display: none; width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); place-items: center; font-size: 14px; color: var(--ink-soft); }

  .container { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }
  main { position: relative; z-index: 2; }

  /* HERO */
  .hero { min-height: 100svh; padding: 150px 0 100px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .hero-badge { display: inline-flex; align-items: center; gap: 9px; padding: 7px 15px 7px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); backdrop-filter: blur(20px); color: var(--ink-soft); font-size: 12px; font-family: var(--font-mono); width: fit-content; margin: 0 auto; }
  .hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 12%, transparent), 0 0 16px var(--blue-glow); animation: pulseDot 2.4s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .hero-title { margin-top: 40px; font-size: clamp(56px, 11vw, 176px); line-height: 0.86; letter-spacing: -0.06em; font-weight: 500; max-width: 16ch; margin-left: auto; margin-right: auto; }
  .hero-title .line { display: block; overflow: hidden; }
  .hero-title .word { display: inline-block; transform: translateY(110%); animation: riseUp 1.3s var(--ease) forwards; }
  .hero-title .line:nth-child(2) .word { animation-delay: 0.08s; }
  .hero-title .line:nth-child(3) .word { animation-delay: 0.16s; }
  @keyframes riseUp { to { transform: translateY(0); } }
  .hero-title em { font-family: var(--font-serif); font-style: italic; font-weight: 400; padding-right: 0.05em; background: linear-gradient(180deg, var(--blue-bright), var(--blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 40px var(--blue-glow)); }
  .hero-sub { margin: 44px auto 0; max-width: 640px; color: var(--ink-soft); font-size: clamp(16px, 1.5vw, 20px); line-height: 1.55; opacity: 0; animation: fadeUp 1.2s 0.5s var(--ease) forwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .hero-actions { margin-top: 44px; display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; opacity: 0; animation: fadeUp 1.2s 0.7s var(--ease) forwards; }
  .btn { height: 52px; padding: 0 26px; border-radius: 999px; display: inline-flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 550; letter-spacing: -0.01em; transition: all 0.45s var(--ease); position: relative; overflow: hidden; }
  .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 12px 40px var(--blue-glow); }
  .btn-primary::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%); transform: translateX(-100%); transition: transform 0.9s var(--ease); }
  .btn-primary:hover::before { transform: translateX(100%); }
  .btn-primary:hover { background: var(--blue-bright); transform: translateY(-2px); box-shadow: 0 20px 60px var(--blue-glow); }
  .btn-primary svg { width: 13px; height: 13px; transition: transform 0.4s; position: relative; z-index: 1; }
  .btn-primary:hover svg { transform: translateX(3px); }
  .btn-primary span { position: relative; z-index: 1; }
  .btn-text { color: var(--blue-ink); font-weight: 500; padding: 0 8px; height: 52px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-text:hover { color: var(--ink); }
  .btn-text svg { width: 12px; height: 12px; transition: transform 0.4s; }
  .btn-text:hover svg { transform: translateX(3px); }
  .hero-trust { margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; text-align: left; opacity: 0; animation: fadeUp 1.2s 1s var(--ease) forwards; max-width: 1040px; margin-left: auto; margin-right: auto; }
  .stat { position: relative; padding-left: 14px; }
  .stat::before { content: ""; position: absolute; left: 0; top: 4px; width: 1px; height: 12px; background: var(--blue); opacity: 0.6; }
  .stat-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); letter-spacing: 0.08em; text-transform: uppercase; }
  .stat-value { margin-top: 8px; font-size: 14.5px; color: var(--ink); font-weight: 450; }

  /* STRIP */
  .strip { padding: 28px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; background: var(--bg); }
  .strip-track { display: flex; gap: 72px; width: max-content; animation: stripScroll 50s linear infinite; }
  .strip-item { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-mute); letter-spacing: 0.10em; text-transform: uppercase; white-space: nowrap; }
  .strip-item::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue-glow); }
  @keyframes stripScroll { to { transform: translateX(-50%); } }

  .section { padding: 160px 0; }
  .section-tag { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); letter-spacing: 0.10em; text-transform: uppercase; }
  .section-tag::before { content: ""; width: 20px; height: 1px; background: var(--blue); }
  .section-heading { margin-top: 28px; font-size: clamp(40px, 5.5vw, 84px); line-height: 0.97; letter-spacing: -0.05em; font-weight: 500; max-width: 20ch; }
  .section-heading em { font-family: var(--font-serif); font-style: italic; font-weight: 400; background: linear-gradient(180deg, var(--blue-bright), var(--blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .section-lead { margin-top: 28px; max-width: 540px; color: var(--ink-soft); font-size: 17px; line-height: 1.6; }

  /* COVERAGE */
  .coverage-section { padding: 140px 0; }
  .coverage-head { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: end; margin-bottom: 72px; }
  .coverage-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; }
  .coverage-cell { background: var(--bg); padding: 40px 32px 44px; min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: background 0.5s var(--ease); overflow: hidden; }
  .coverage-cell::before { content: ""; position: absolute; inset: 0; background: radial-gradient(400px circle at var(--mx,50%) var(--my,50%), var(--blue-glow), transparent 45%); opacity: 0; transition: opacity 0.5s; pointer-events: none; }
  .coverage-cell:hover { background: var(--bg-elev); }
  .coverage-cell:hover::before { opacity: 0.28; }
  .coverage-region { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); letter-spacing: 0.10em; text-transform: uppercase; }
  .coverage-flag { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); }
  .coverage-time { margin-top: auto; font-size: 42px; line-height: 1; letter-spacing: -0.045em; font-weight: 500; font-variant-numeric: tabular-nums; }
  .coverage-city { margin-top: 8px; font-size: 13.5px; color: var(--ink-soft); }
  .coverage-status { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); letter-spacing: 0.08em; text-transform: uppercase; }
  .coverage-status-dot { width: 5px; height: 5px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.6); animation: pulseDot 2.4s ease-in-out infinite; }

  /* MANIFESTO */
  .manifesto { padding: 180px 0 160px; }
  .manifesto-inner { display: grid; grid-template-columns: 200px 1fr; gap: 80px; align-items: start; max-width: 1180px; margin: 0 auto; }
  .manifesto-quote { font-size: clamp(32px, 4.4vw, 66px); line-height: 1.08; letter-spacing: -0.045em; font-weight: 450; }
  .manifesto-quote em { font-family: var(--font-serif); font-style: italic; font-weight: 400; background: linear-gradient(180deg, var(--blue-bright), var(--blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .manifesto-quote .dim { color: var(--ink-faint); }

  /* SERVICES */
  .services-grid { margin-top: 80px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 32px; overflow: hidden; }
  .service { background: var(--bg); padding: 44px 36px 48px; min-height: 340px; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: background 0.5s; overflow: hidden; }
  .service::before { content: ""; position: absolute; inset: 0; background: radial-gradient(500px circle at var(--mx,50%) var(--my,50%), var(--blue-glow), transparent 45%); opacity: 0; transition: opacity 0.5s; pointer-events: none; }
  .service:hover { background: var(--bg-elev); }
  .service:hover::before { opacity: 0.35; }
  .service-num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); letter-spacing: 0.10em; }
  .service-content { margin-top: auto; position: relative; z-index: 1; }
  .service h3 { font-size: 26px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 500; margin-bottom: 14px; }
  .service h3 em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--ink-soft); }
  .service p { color: var(--ink-soft); font-size: 14px; line-height: 1.55; max-width: 34ch; }
  .service-arrow { position: absolute; top: 40px; right: 36px; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; color: var(--ink-mute); transition: all 0.5s var(--ease); z-index: 1; background: var(--bg); }
  .service-arrow svg { width: 13px; height: 13px; transition: transform 0.5s; }
  .service:hover .service-arrow { background: var(--blue); border-color: var(--blue); color: #fff; transform: rotate(-45deg) scale(1.08); box-shadow: 0 0 32px var(--blue-glow); }

  /* PROCESS */
  .process-head { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: end; margin-bottom: 80px; }
  .process-list { border-top: 1px solid var(--line); }
  .process-step { display: grid; grid-template-columns: 130px 1fr 1fr; gap: 40px; padding: 48px 0; border-bottom: 1px solid var(--line); position: relative; transition: padding 0.6s var(--ease); }
  .process-step::before { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--blue) 8%, transparent), transparent); transition: width 0.6s; }
  .process-step:hover::before { width: 100%; }
  .process-step:hover { padding-left: 24px; padding-right: 24px; }
  .process-num { font-family: var(--font-mono); font-size: 12px; color: var(--blue-ink); letter-spacing: 0.08em; padding-top: 8px; }
  .process-step h3 { font-size: clamp(26px, 3vw, 40px); line-height: 1; letter-spacing: -0.045em; font-weight: 500; }
  .process-step p { color: var(--ink-soft); line-height: 1.6; font-size: 15px; max-width: 46ch; padding-top: 4px; }

  /* PRINCIPLES */
  .principles-section { padding: 160px 0; }
  .principles-head { display: flex; justify-content: space-between; align-items: end; gap: 40px; flex-wrap: wrap; margin-bottom: 72px; }
  .principles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .principle { position: relative; padding: 48px 40px 44px; border: 1px solid var(--line); border-radius: 28px; background: var(--bg-elev); min-height: 420px; display: flex; flex-direction: column; transition: all 0.6s var(--ease); overflow: hidden; box-shadow: 0 4px 20px rgba(10,10,12,0.03); }
  html[data-theme="dark"] .principle { background: var(--surface); backdrop-filter: blur(24px); }
  .principle::after { content: ""; position: absolute; inset: 0; background: radial-gradient(600px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb, var(--blue) 10%, transparent), transparent 45%); opacity: 0; transition: opacity 0.5s; pointer-events: none; }
  .principle:hover::after { opacity: 1; }
  .principle:hover { transform: translateY(-6px); box-shadow: var(--shadow-deep); }
  .principle-icon { width: 60px; height: 60px; border: 1px solid var(--line); border-radius: 18px; display: grid; place-items: center; color: var(--blue-ink); font-size: 24px; background: var(--surface-2); transition: all 0.6s; }
  .principle:hover .principle-icon { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 0 40px var(--blue-glow); transform: rotate(-6deg) scale(1.05); }
  .principle-num { position: absolute; top: 40px; right: 40px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); letter-spacing: 0.10em; }
  .principle h3 { margin-top: auto; font-size: 26px; line-height: 1.1; letter-spacing: -0.035em; font-weight: 500; max-width: 14ch; }
  .principle h3 em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--ink-soft); }
  .principle p { margin-top: 16px; color: var(--ink-soft); line-height: 1.6; font-size: 14.5px; max-width: 32ch; }

  /* REVIEWS */
  .reviews-section { padding: 140px 0 120px; overflow: hidden; }
  .reviews-header { width: min(1240px, calc(100% - 48px)); margin: 0 auto 70px; display: flex; justify-content: space-between; align-items: end; gap: 40px; flex-wrap: wrap; }
  .reviews-nav { display: flex; gap: 8px; }

        deepMerge(target[k], source[k]);
      } else {
        target[k] = source[k];

    }
    return target;

  }

  const el = id => document.getElementById(id);

  function renderAll() {
    // Nav
    el("brandName").textContent = DATA.brand.name;
    el("navCta").textContent = DATA.brand.navCta;
    el("navLinks").innerHTML = DATA.brand.navLinks.map(l => `<a href="${l.href}">${l.label}</a>`).join("");

    // Hero
    el("heroBadge").innerHTML = `<span class="hero-badge-dot"></span><span>${DATA.hero.badge}</span>`;
    el("heroTitle").innerHTML = `
      <span class="line"><span class="word">${DATA.hero.titleLine1}</span></span>
      <span class="line"><span class="word"><em>${DATA.hero.titleLine2Em}</em>${DATA.hero.titleLine2Rest}</span></span>
      <span class="line"><span class="word">${DATA.hero.titleLine3}</span></span>
    `;
    el("heroSub").textContent = DATA.hero.subtitle;
    el("heroActions").innerHTML = `
      <a href="${DATA.hero.btn1.href}" class="btn btn-primary">
        <span>${DATA.hero.btn1.text}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a href="${DATA.hero.btn2.href}" class="btn-text">
        ${DATA.hero.btn2.text}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    `;
    el("heroTrust").innerHTML = DATA.hero.stats.map(s => `
      <div class="stat"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>
    `).join("");

    // Strip
    const stripItems = [...DATA.strip.items, ...DATA.strip.items];
    el("stripTrack").innerHTML = stripItems.map(i => `<span class="strip-item">${i}</span>`).join("");

    // Coverage
    el("coverageTag").textContent = DATA.coverage.tag;
    el("coverageHeading").innerHTML = `${DATA.coverage.heading}<br /><em>${DATA.coverage.headingEm}</em>`;
    el("coverageLead").textContent = DATA.coverage.lead;
    el("coverageGrid").innerHTML = DATA.coverage.regions.map(r => `
      <article class="coverage-cell tilt-coverage">
        <div class="coverage-region"><span>${r.name}</span><span class="coverage-flag">${r.flag}</span></div>
        <div>
          <div class="coverage-time" data-tz="${r.tz}">—</div>
          <div class="coverage-city">${r.cities}</div>
        </div>
        <div class="coverage-status"><span class="coverage-status-dot"></span><span>${r.status}</span></div>
      </article>
    `).join("");

    // Manifesto
    el("manifestoTag").textContent = DATA.manifesto.tag;
    el("manifestoQuote").innerHTML = `${DATA.manifesto.text}<span class="dim">${DATA.manifesto.dim}</span>${DATA.manifesto.middle}<em>${DATA.manifesto.em}</em>${DATA.manifesto.end}`;

    // Services
    el("servicesTag").textContent = DATA.services.tag;
    el("servicesHeading").innerHTML = `${DATA.services.heading}<em>${DATA.services.headingEm}</em>${DATA.services.headingEnd}`;
    el("servicesLead").textContent = DATA.services.lead;
    el("servicesGrid").innerHTML = DATA.services.items.map(s => `
      <article class="service tilt">
        <div class="service-num">${s.num}</div>
        <div class="service-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg></div>
        <div class="service-content"><h3>${s.title}<em>${s.titleEm}</em></h3><p>${s.desc}</p></div>
      </article>
    `).join("");

    // Process
    el("processTag").textContent = DATA.process.tag;
    el("processHeading").innerHTML = `${DATA.process.heading}<br /><em>${DATA.process.headingEm}</em>`;
    el("processLead").textContent = DATA.process.lead;
    el("processList").innerHTML = DATA.process.steps.map(s => `
      <article class="process-step"><div class="process-num">${s.num}</div><h3>${s.title}</h3><p>${s.desc}</p></article>
    `).join("");

    // Principles
    el("principlesTag").textContent = DATA.principles.tag;
    el("principlesHeading").innerHTML = `${DATA.principles.heading}<em>${DATA.principles.headingEm}</em>${DATA.principles.headingEnd}`;
    el("principlesLead").textContent = DATA.principles.lead;
    el("principlesGrid").innerHTML = DATA.principles.items.map(p => `
      <article class="principle tilt-principle">
        <div class="principle-icon">${p.icon}</div>
        <div class="principle-num">${p.num}</div>
        <h3>${p.title}<em>${p.titleEm}</em></h3>
        <p>${p.desc}</p>
      </article>
    `).join("");

    // Reviews
    el("reviewsTag").textContent = DATA.reviews.tag;
    el("reviewsHeading").innerHTML = `${DATA.reviews.heading}<br /><em>${DATA.reviews.headingEm}</em>${DATA.reviews.headingEnd}`;
    buildCarousel();

    // CTA
    el("ctaEyebrow").textContent = DATA.cta.eyebrow;
    el("ctaTitle").innerHTML = `${DATA.cta.title}<em>${DATA.cta.titleEm}</em>`;
    el("ctaSub").textContent = DATA.cta.sub;
    el("ctaActions").innerHTML = `
      <a href="${DATA.cta.btn1.href}" class="btn btn-primary"><span>${DATA.cta.btn1.text}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <a href="${DATA.cta.btn2.href}" target="_blank" rel="noopener" class="btn-text">${DATA.cta.btn2.text}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    `;

    // Footer
    el("footerBrandName").textContent = DATA.brand.name;
    el("footerDesc").textContent = DATA.footer.desc;
    el("footerCopyright").textContent = DATA.footer.copyright;
    el("footerBottomText").textContent = DATA.footer.bottomText;
    const f = DATA.footer.founder;
    el("footerFounder").innerHTML = `
      <div class="footer-founder-photo"><img src="${f.photo}" alt="${f.name}" loading="lazy" /></div>
      <div class="footer-founder-info">
        <strong>${f.name}</strong>
        <span>${f.title}</span>
        <a href="mailto:${f.email}" class="footer-founder-mail">${f.email}</a>
      </div>
    `;
    ["footCol1","footCol2","footCol3"].forEach((id, i) => {
      const c = DATA.footer.columns[i];
      el(id).innerHTML = c ? `<h4>${c.title}</h4>${c.links.map(l => `<a href="${l.href}">${l.label}</a>`).join("")}` : "";
    });

    el("year").textContent = new Date().getFullYear();
  }

  /* =========================================================
     CAROUSEL
     ========================================================= */
  const carousel = { offset: 0, speed: 0.35, paused: false, halfWidth: 0, dragging: false, startX: 0, startOffset: 0 };

  function buildCarousel() {
    const items = [...DATA.reviews.items, ...DATA.reviews.items];
    el("carouselTrack").innerHTML = items.map(r => `
      <article class="review-card">
        <div>
          <div class="review-stars">★ ★ ★ ★ ★</div>
          <p class="review-quote">"${r.quote}"</p>
        </div>
        <div class="review-author">
          <div class="review-avatar"><img src="${r.avatar}" alt="" loading="lazy" /></div>
          <div><div class="review-name">${r.name}</div><div class="review-role">${r.role}</div></div>
        </div>
      </article>
    `).join("");
    carousel.halfWidth = el("carouselTrack").scrollWidth / 2;
  }

  function animateCarousel() {
    if (!carousel.paused) carousel.offset -= carousel.speed;
    if (Math.abs(carousel.offset) >= carousel.halfWidth) carousel.offset += carousel.halfWidth;
    el("carouselTrack").style.transform = `translate3d(${carousel.offset}px, 0, 0)`;
    requestAnimationFrame(animateCarousel);
  }

  /* =========================================================
     INITIALIZERS
     ========================================================= */
  function initTheme() {
    const html = document.documentElement;
    html.setAttribute("data-theme", localStorage.getItem("nebulance-theme") || "light");
    el("themeToggle").addEventListener("click", () => {
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("nebulance-theme", next);
    });
  }

  function updateTimes() {
    document.querySelectorAll(".coverage-time").forEach(e => {
      const tz = e.getAttribute("data-tz");
      if (!tz) return;
      try {
        e.textContent = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
      } catch { e.textContent = "—"; }
    });
  }

  function initCursorLight() {
    const light = el("cursorLight");
    let mx=0, my=0, lx=0, ly=0, raf;
    window.addEventListener("pointermove", e => { mx=e.clientX; my=e.clientY; if(!raf) raf=requestAnimationFrame(tick); });
    function tick() {
      lx += (mx-lx)*0.09; ly += (my-ly)*0.09;
      light.style.left = lx+"px"; light.style.top = ly+"px";
      if (Math.abs(mx-lx)>0.1 || Math.abs(my-ly)>0.1) raf=requestAnimationFrame(tick); else raf=null;
    }
  }

  function initCardTracking() {
    document.querySelectorAll(".tilt, .tilt-principle, .tilt-coverage").forEach(card => {
      card.addEventListener("pointermove", e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty("--mx", ((e.clientX-r.left)/r.width)*100 + "%");
        card.style.setProperty("--my", ((e.clientY-r.top)/r.height)*100 + "%");
      });
    });
  }

  function initReveal() {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".reveal").forEach(x => io.observe(x));
  }

  function initSmoothAnchor() {
    document.querySelectorAll('a[href^="#"]').forEach(link => {
      link.addEventListener("click", e => {
        const id = link.getAttribute("href");
        if (id === "#" || id.length < 2) return;
        const t = document.querySelector(id);
        if (!t) return;
        e.preventDefault();
        window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 70, behavior: "smooth" });
      });
    });
  }

  function initMobileMenu() {
    el("menuBtn").addEventListener("click", () => {
      const open = el("navLinks").classList.toggle("mobile-open");
      el("menuBtn").textContent = open ? "✕" : "☰";
    });
  }

  function initCarouselControls() {
    const win = el("carouselWindow");
    win.addEventListener("mouseenter", () => carousel.paused = true);
    win.addEventListener("mouseleave", () => carousel.paused = false);
    el("nextReview").addEventListener("click", () => { carousel.offset -= 420; if (Math.abs(carousel.offset) >= carousel.halfWidth) carousel.offset += carousel.halfWidth; });
    el("prevReview").addEventListener("click", () => { carousel.offset += 420; if (carousel.offset > 0) carousel.offset -= carousel.halfWidth; });
    win.addEventListener("pointerdown", e => { carousel.dragging = true; carousel.paused = true; carousel.startX = e.clientX; carousel.startOffset = carousel.offset; win.setPointerCapture(e.pointerId); });
    win.addEventListener("pointermove", e => {
      if (!carousel.dragging) return;
      carousel.offset = carousel.startOffset + (e.clientX - carousel.startX) * 1.2;
      if (Math.abs(carousel.offset) >= carousel.halfWidth) carousel.offset += (carousel.offset < 0 ? carousel.halfWidth : -carousel.halfWidth);
      if (carousel.offset > 0) carousel.offset -= carousel.halfWidth;
    });
    win.addEventListener("pointerup", () => { carousel.dragging = false; carousel.paused = false; });
    win.addEventListener("pointercancel", () => { carousel.dragging = false; carousel.paused = false; });
    window.addEventListener("resize", () => { carousel.halfWidth = el("carouselTrack").scrollWidth / 2; });
  }

  async function init() {
    DATA = await loadContent();
    renderAll();

    // Hide loader after paint
    requestAnimationFrame(() => {
      el("loadingOverlay").classList.add("hidden");
      setTimeout(() => el("loadingOverlay").remove(), 600);
    });

    initTheme();
    updateTimes(); setInterval(updateTimes, 30000);
    initCursorLight();
    initCardTracking();
    initReveal();
    initSmoothAnchor();
    initMobileMenu();
    initCarouselControls();
    animateCarousel();
  }

  document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
